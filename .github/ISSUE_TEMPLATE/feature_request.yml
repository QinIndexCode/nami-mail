name: Feature Request / 功能建议
description: Propose an improvement with clear user value and boundaries / 提出有明确用户价值和边界的改进建议
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        请描述问题和使用场景，而不是仅给出实现名称。不要附上真实邮件、账户、附件、令牌或密码。

        Describe the problem and use case, not just the implementation name. Do not attach real mail, accounts, attachments, tokens, or passwords.
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem to Solve
      description: 哪类用户在什么场景下遇到什么阻碍？ / What kind of user encounters what obstacle in what scenario?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的体验或行为 / Proposed Experience or Behavior
      description: 说明用户可见结果、关键状态和失败时的期望。 / Describe the user-visible result, key states, and expected behavior on failure.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案 / Alternatives Considered
      description: 可选。说明当前工作流、服务商限制或已有工具为何不够。 / Optional. Explain why the current workflow, provider limitations, or existing tools are insufficient.
  - type: dropdown
    id: area
    attributes:
      label: 相关领域 / Area
      options:
        - 邮箱接入或 OAuth / Email provider or OAuth
        - 收件箱、阅读或搜索 / Inbox, reading, or search
        - 撰写、草稿或发送状态 / Compose, drafts, or send status
        - 设置、通知或桌面集成 / Settings, notifications, or desktop integration
        - 隐私、安全或本地数据 / Privacy, security, or local data
        - 发布、安装或更新 / Release, installation, or updates
        - 文档或其他 / Documentation or other
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 数据边界确认 / Data Boundary Confirmation
      options:
        - label: 此建议不要求提交或暴露真实邮件、凭据、令牌或个人信息。 / This request does not require submitting or exposing real mail, credentials, tokens, or personal information.
          required: true

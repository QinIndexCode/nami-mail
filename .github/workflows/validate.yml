name: Validate Pull Request

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

# This workflow executes pull-request code, including code from forks. Keep its
# token read-only and do not use pull_request_target or repository secrets.
permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      # v4.2.2; pin the action implementation for untrusted pull-request code.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # v4.4.0; pin the action implementation for untrusted pull-request code.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      # better-sqlite3 v13 uses a shared Windows x64 N-API prebuild. Verify
      # both runtime loaders before source-only checks can mask a regression.
      - run: npm run verify:node-sqlite
      - run: npm run verify:electron-sqlite
      - run: npm run smoke:server-node
      # Fail when committed icons or theme marks no longer match their source artwork.
      - run: npm run build:brand:check
      # Every script-level invariant lives in scripts/tests/ and is discovered
      # by this one run: watchdog restart backoff, kill-safe packaging trust
      # injection, dev ports pinned to the server PORT default, the docs-to-wiki
      # page mapping, the docs-site builder (a pull request cannot merge a
      # broken internal link or a heading anchor that no longer exists) and the
      # GitHub ZIP update assets (the Ed25519 trust record must never embed the
      # release private key).
      - run: node --test "scripts/tests/*.test.mjs"
      - run: node scripts/build-docs-site.mjs
      - run: node scripts/build-locale-catalog.mjs --check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test
      - run: npm run test:desktop-security
      - run: npm run smoke:runtime
      # The e2e suite drives the web app in demo mode from a Vite dev server.
      - run: npx playwright install chromium
      - run: npm run test:e2e
      # The demo specs never issue a request, so this one boots a seeded fixture
      # server to cover renderer -> proxy -> Fastify -> SQLite for real. It needs
      # the build step above for apps/server/dist.
      - run: npm run test:e2e:real
      # Desktop smoke reuses the build step above, so only verify the Electron
      # ABI and then launch the bundled app under its own smoke harness.
      - run: npm run verify:electron-sqlite && node scripts/smoke-desktop.mjs
      - run: npm audit --omit=dev --audit-level=high

name: Update contributors

# Runs every day at 03:00 UTC, or manually, or whenever README files change.
# GitHub Actions allows scheduled runs as frequent as every 5 minutes;
# once per day is well within limits and consumes only 1–2 API calls
# against the 5 000 req/h GITHUB_TOKEN quota.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "README.zh-CN.md"
      - "README.en.md"
      - "scripts/update-contributors.mjs"
      - ".github/workflows/update-contributors.yml"

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: update-contributors
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0

      - name: Fetch contributors and update lists
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/update-contributors.mjs

      # Opens a PR when the contributor list changes. The next step waits for
      # the required "validate" check, merges the PR (squash) and dispatches
      # the Pages deployment — no manual review needed.
      - name: Open or update pull request
        id: pr
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5e914681df9dc83aa4e4905692ca88beb2f9e91f
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update contributor list"
          branch: chore/update-contributors
          delete-branch: true
          title: "chore: update contributor list"
          body: |
            Automated contributor list refresh.

            This PR was opened by the **Update contributors** workflow. The
            workflow merges it once the required status checks pass and then
            deploys the site.
          labels: "automated,documentation"
          author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
      # PRs created with the default GITHUB_TOKEN do not trigger the validate
      # workflow (GitHub's recursion prevention), so workflow_dispatch is used
      # to validate the PR branch explicitly.
      #
      # Auto-merge is asynchronous and can take anywhere from minutes to hours
      # to land. Wait for the required `validate` check, merge synchronously,
      # then dispatch the Pages deployment. The merge is performed with
      # GITHUB_TOKEN, so its push event cannot trigger pages.yml, while
      # workflow_dispatch is the documented exception to that rule.
      - name: Validate, merge, and deploy
        if: steps.pr.outputs.pull-request-number != ''
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_number="${{ steps.pr.outputs.pull-request-number }}"
          gh workflow run validate.yml --ref "chore/update-contributors"

          for _ in $(seq 1 160); do
            state=$(gh pr view "$pr_number" --json state --jq '.state')
            if [ "$state" = "MERGED" ]; then
              gh workflow run pages.yml --ref main
              echo "Pull request #$pr_number was already merged; dispatched the site deployment."
              exit 0
            fi
            if [ "$state" = "CLOSED" ]; then
              echo "Pull request #$pr_number was closed without merging; skipping deployment."
              exit 0
            fi

            checks=$(gh pr view "$pr_number" --json statusCheckRollup --jq '
              [.statusCheckRollup[] | select(.name == "validate")] as $required
              | if ($required | length) == 0 then "pending"
                elif ([.statusCheckRollup[] | select(.conclusion != null
                  and .conclusion != "SUCCESS"
                  and .conclusion != "NEUTRAL"
                  and .conclusion != "SKIPPED")] | length) > 0 then "failed"
                elif ([.statusCheckRollup[] | select(.status != "COMPLETED")] | length) > 0 then "pending"
                else "ready" end')

            case "$checks" in
              ready)
                if gh pr merge --squash --delete-branch "$pr_number"; then
                  echo "Merged pull request #$pr_number."
                else
                  state=$(gh pr view "$pr_number" --json state --jq '.state')
                  if [ "$state" != "MERGED" ]; then
                    echo "Failed to merge pull request #$pr_number." >&2
                    exit 1
                  fi
                fi
                gh workflow run pages.yml --ref main
                echo "Dispatched the site deployment."
                exit 0
                ;;
              failed)
                echo "Required checks for pull request #$pr_number failed." >&2
                exit 1
                ;;
            esac

            sleep 15
          done

          echo "Timed out waiting for pull request #$pr_number to pass validation." >&2
          exit 1


name: Deploy site

on:
  push:
    branches: [main]
    # A change to this workflow is itself worth deploying, so the deploy that a
    # fix produces is the one that proves the fix.
    paths:
      - "site/**"
      - "docs/**"
      - "scripts/build-docs-site.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
          cache: npm
      # The pages are pre-rendered from `docs/`, which needs the Markdown parser
      # declared in the root package. `--ignore-scripts` skips the repository's
      # postinstall, which downloads the Electron runtime that a static site
      # build has no use for.
      - name: Install the build dependencies
        run: npm ci --ignore-scripts
      - name: Build the site from docs/
        run: node scripts/build-docs-site.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

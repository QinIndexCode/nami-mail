name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      # v4.2.2; pin the action implementation for a secret-free validation job.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # The promote step reads docs/releases/v<version>.md. A missing file used
      # to surface only after the release job had signed, packaged, and uploaded
      # assets (burning a runner plus an approval). Fail here, before any heavy
      # check, with an actionable message.
      - name: Check the paired release notes exist
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $notes = "docs/releases/v$version.md"
          if (-not (Test-Path $notes)) { throw "Missing $notes — promote-github-release.mjs requires it. Create the paired release notes (docs/releases/v$version.md) before tagging." }
          if (-not ((Get-Content $notes -Raw).Trim())) { throw "$notes is empty — promote-github-release.mjs requires non-empty release notes." }
      # v4.4.0; pin the action implementation for a secret-free validation job.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run verify:node-sqlite
      - run: npm run verify:electron-sqlite
      - run: npm run smoke:server-node
      - run: npm run build:brand:check
      - run: node --test scripts/release-policy.test.mjs
      - run: node --test scripts/build-locale-catalog.test.mjs
      - run: node --test scripts/dev-server-backoff.test.mjs scripts/package-win-trust.test.mjs scripts/dev-port-sync.test.mjs
      - run: node --test scripts/github-update-assets.test.mjs
      - run: node --test scripts/wiki-sync.test.mjs
      - run: node --test scripts/build-docs-site.test.mjs
      - run: node scripts/build-docs-site.mjs
      - run: node scripts/build-locale-catalog.mjs --check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test
      - run: npm run test:desktop-security
      - run: npm run smoke:runtime
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: npm run verify:electron-sqlite && node scripts/smoke-desktop.mjs
      - run: npm audit --omit=dev --audit-level=high

  release:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    env:
      NAMI_MAIL_GITHUB_REPOSITORY: ${{ github.repository }}
      NAMI_MAIL_RELEASE_DIRECTORY: release-artifacts/${{ github.ref_name }}
    steps:
      # v4.2.2; pin the action implementation before this job receives release secrets.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # v4.4.0; pin the action implementation before this job receives release secrets.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - name: Sign, upload draft, and run package smoke
        timeout-minutes: 30
        run: npm run publish:github
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          NAMI_MAIL_EXPECTED_WINDOWS_PUBLISHER: ${{ secrets.WINDOWS_CSC_PUBLISHER }}
          NAMI_MAIL_EXPECTED_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CSC_THUMBPRINT }}
          NAMI_MAIL_UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.NAMI_MAIL_UPDATE_ED25519_PRIVATE_KEY }}
      - name: Verify remote draft and publish stable release
        run: node scripts/promote-github-release.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload release smoke diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-smoke-diagnostics-${{ github.ref_name }}
          path: |
            output/desktop-smoke-diagnostic.json
            output/installer-smoke-diagnostic.json
            output/package-smoke-diagnostic.json
          if-no-files-found: ignore
          retention-days: 7

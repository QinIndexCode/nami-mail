<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6ebef"/>
      <stop offset="0.5" stop-color="#c3cfda"/>
      <stop offset="1" stop-color="#96abc0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.9  0 0 0 0 1  0 0 0 0.05 0"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#mist)"/>
  <ellipse cx="380" cy="330" rx="620" ry="190" fill="#f4f7fa" opacity="0.5" filter="url(#soft)"/>
  <ellipse cx="1180" cy="520" rx="560" ry="200" fill="#eef3f7" opacity="0.55" filter="url(#soft)"/>
  <ellipse cx="760" cy="780" rx="700" ry="230" fill="#dde6ee" opacity="0.6" filter="url(#soft)"/>
  <rect width="1600" height="1000" filter="url(#grain)"/>
</svg>
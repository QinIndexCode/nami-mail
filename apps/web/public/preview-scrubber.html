  .wrap { position: relative; flex: 1; min-height: 0; }
  .transcript { position: absolute; inset: 0; overflow-y: auto; padding: 22px clamp(18px, 4.5vw, 48px); scrollbar-width: none; }
  .transcript::-webkit-scrollbar { display: none; }
  .msg { max-width: 760px; margin: 0 auto 20px; }
  .msg-meta { display: flex; align-items: center; gap: 7px; min-height: 20px; margin-bottom: 5px; color: var(--text-faint); font-size: 10px; }
  .msg.assistant .msg-meta { justify-content: flex-start; }
  .msg.user .msg-meta { justify-content: flex-end; }
  .msg-role { padding: 2px 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel-muted); color: var(--text-soft); font-size: 10px; font-weight: 700; }
  .msg-bubble { color: var(--text); font-size: 13px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user .msg-bubble { max-width: min(100%, 580px); margin-left: auto; padding: 10px 14px; border: 1px solid rgba(21,21,23,0.24); border-radius: 12px 12px 4px 12px; background: rgba(21,21,23,0.06); }

  .scrubber { position: absolute; z-index: 6; top: 8px; left: 6px; bottom: 8px; width: 18px; cursor: pointer; }
  .scrubber-bar { position: absolute; left: 0; display: block; height: 2px; border-radius: 999px; background: var(--line-strong); transition: width .14s ease, background-color .14s ease; pointer-events: none; }
  .scrubber-bar.hovered { background: var(--text-soft); }
  .scrubber-preview { position: absolute; z-index: 7; left: calc(100% + 8px); max-width: 280px; transform: translateY(-50%); }

</style>

  // Edge-zone scroll speed eases toward the edge, with a small floor so the
  // motion stays perceptible once the zone is entered.
  function speedFor(distanceToEdge) {
    var factor = Math.pow(1 - Math.min(1, distanceToEdge / EDGE_ZONE), 2);
    return Math.max(MIN_SPEED, MAX_SPEED * factor);
  }

  // Bars blur near the top/bottom edge of the track to dissolve into the
  // boundary instead of being clipped hard.
  function barBlur(top, trackH) {
    var d = Math.min(top, trackH - top);

    "本周工作邮件共 23 封，已按项目分类：A 项目 9 封、B 项目 7 封、日常协调 5 封、法务 2 封。目录已生成。",
    "已回复老板：同意下周一前往上海出差，并询问是否需要预订酒店和往返车票，等待确认。"
  ];

  var transcript = document.getElementById("transcript");
  var scrubber = document.getElementById("scrubber");
  var userEls = [];   // DOM element per user message
  var positions = []; // content coordinate per user message

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function messagesUpTo(count) {
    var out = [];
    for (var i = 0; i < count; i += 1) out.push(userMessages[i % userMessages.length]);
    return out;
  }

  function render(count) {
    var frag = document.createDocumentFragment();
    messagesUpTo(count).forEach(function (text, index) {
      // user message
      var u = el("div", "msg user");
      var meta = el("div", "msg-meta");
      meta.appendChild(el("time", null, "08:" + String(9 + index % 50).padStart(2, "0")));
      u.appendChild(meta);
      var bubble = el("div", "msg-bubble", text);
      u.appendChild(bubble);
      var attachments = userAttachments[index % userAttachments.length];
      if (attachments) {
        var attach = el("div", "msg-attach");
        attachments.forEach(function (name) { attach.appendChild(el("span", null, "\uD83D\uDCCE " + name)); });
        u.appendChild(attach);
      }
      if (index % 7 === 3) {
        var quote = el("div", "msg-quote", "\u201C收到，我这边明天给你答复。\u201D");
        u.insertBefore(quote, bubble);
      }
      userEls[index] = u;
      frag.appendChild(u);
      // assistant reply
      var a = el("div", "msg assistant");
      var aMeta = el("div", "msg-meta");
      aMeta.appendChild(el("span", "msg-role", "助理"));
      aMeta.appendChild(el("time", null, "08:" + String(10 + index % 50).padStart(2, "0")));
      a.appendChild(aMeta);
      a.appendChild(el("div", "msg-bubble", assistantReplies[index % assistantReplies.length]));
      frag.appendChild(a);
    });
    transcript.appendChild(frag);
  }

  function measure() {
    var top = transcript.getBoundingClientRect().top;
    positions = userEls.map(function (node) {
      return node.getBoundingClientRect().top - top + transcript.scrollTop;
    });
  }

  var bars = [];
  var hoveredIndex = null;
  var scrolling = false;
  var dirRef = 1, speedRef = 0;
  // Viewport offset (px) of the bar group inside the track. null until first
  // measurement; edge-zone auto-scroll moves this offset so the BARS scroll,
  // never the transcript content.
  var viewport = null;

  function barWidth(index) {
    if (hoveredIndex === null) return 3;
    return Math.max(9, 26 - Math.abs(index - hoveredIndex) * 6);
  }

  function buildBars() {
    scrubber.textContent = "";
    bars = userEls.map(function (_, index) {
      var bar = el("span", "scrubber-bar");
      bar.style.height = "2px";
      bar.style.left = "0";
      scrubber.appendChild(bar);
      return bar;
    });
  }

  function initViewport(trackH) {
    var totalHeight = (userEls.length - 1) * GAP;
    // Centre the group when it fits; bottom-anchor (newest visible) when it
    // overflows the track.
    viewport = Math.min((trackH - totalHeight) / 2, trackH - totalHeight);
    return totalHeight;
  }

  function layoutBars() {
    var trackH = scrubber.clientHeight;
    if (viewport === null) initViewport(trackH);
    bars.forEach(function (bar, index) {
      var top = viewport + index * GAP;
      bar.style.top = top + "px";
      bar.style.width = barWidth(index) + "px";
      var blur = barBlur(top, trackH);
      bar.style.filter = blur > 0 ? "blur(" + blur + "px)" : "";
      bar.classList.toggle("hovered", hoveredIndex === index);
    });
  }

  var preview = null;
  function showPreview(index, text) {
    if (!preview) {
      preview = el("div", "scrubber-preview");
      preview.appendChild(el("span", "scrubber-preview-bubble"));
      scrubber.appendChild(preview);
    }
    var trackH = scrubber.clientHeight;
    if (viewport === null) initViewport(trackH);
    var raw = viewport + index * GAP;
    var clamped = Math.max(14, Math.min(raw, trackH - 14));
    preview.style.top = clamped + "px";
    preview.firstChild.textContent = (text || "").slice(0, 120) + (text && text.length > 120 ? "\u2026" : "");
  }
  function hidePreview() {
    if (preview) { preview.remove(); preview = null; }
  }

  function truncate(text, max) {
    if (text.length <= max) return text;
    return text.slice(0, max) + "\u2026";
  }

  scrubber.addEventListener("mousemove", function (e) {
    var track = scrubber.getBoundingClientRect();
    var y = e.clientY - track.top;
    var count = userEls.length;
    var totalHeight = (count - 1) * GAP;
    if (viewport === null) initViewport(track.height);
    var nearest = 0, nearestDistance = Infinity;
    for (var i = 0; i < count; i++) {
      var d = Math.abs(viewport + i * GAP - y);
      if (d < nearestDistance) { nearestDistance = d; nearest = i; }
    }
    hoveredIndex = nearest;
    showPreview(nearest, userMessages[nearest]);
    layoutBars();
    if (totalHeight > track.height) {
      if (y <= EDGE_ZONE) {
        dirRef = 1; speedRef = speedFor(y);
        if (!scrolling) { scrolling = true; requestAnimationFrame(tick); }
        return;
      }
      if (y >= track.height - EDGE_ZONE) {
        dirRef = -1; speedRef = speedFor(track.height - y);
        if (!scrolling) { scrolling = true; requestAnimationFrame(tick); }
        return;
      }
    }
    scrolling = false;
  });
  scrubber.addEventListener("mouseleave", function () {
    hoveredIndex = null;
    scrolling = false;
    hidePreview();
    layoutBars();
  });
  scrubber.addEventListener("click", function () {
    if (hoveredIndex === null) return;
    var position = positions[hoveredIndex];
    if (position === undefined) return;
    transcript.scrollTo({ top: Math.max(0, position - 16), behavior: "smooth" });
  });

  function tick() {
    if (!scrolling || viewport === null) return;
    var trackH = scrubber.clientHeight;
    var maxOffset = (userEls.length - 1) * GAP - trackH;
    var next = Math.min(0, Math.max(-maxOffset, viewport + dirRef * speedRef));
    if (next === viewport) {
      // Reached a bound: stop instead of looping forever.
      scrolling = false;
      layoutBars();
      return;
    }
    viewport = next;
    layoutBars();
    requestAnimationFrame(tick);
  }

  var currentCount = 70;
  function setCount(count) {
    currentCount = count;
    hoveredIndex = null;
    scrolling = false;
    viewport = null;
    hidePreview();
    transcript.textContent = "";
    userEls = [];
    render(count);
    buildBars();
    measure();
    layoutBars();
    document.querySelectorAll("[data-count]").forEach(function (btn) {
      btn.classList.toggle("on", Number(btn.getAttribute("data-count")) === count);
    });
  }
  document.querySelectorAll("[data-count]").forEach(function (btn) {
    btn.addEventListener("click", function () { setCount(Number(btn.getAttribute("data-count"))); });
  });
  window.addEventListener("resize", function () { measure(); viewport = null; layoutBars(); });
  setCount(currentCount);
})();
</script>
</body>
</html>

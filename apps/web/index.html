<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f4f5" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>Nami Mail</title>
    <style>
      #nami-splash {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; align-items: center; justify-content: center;
        background: #ececef;
        transition: opacity .5s ease, visibility .5s ease;
      }
      @media (prefers-color-scheme: dark) { #nami-splash { background: #1a1a1e; } }
      #nami-splash.done { opacity: 0; visibility: hidden; pointer-events: none; }
      .nami-splash-content { display: flex; align-items: center; justify-content: center; }
      .nami-splash-logo {
        width: 64px; height: 64px; opacity: 0; transform: scale(1.6); flex-shrink: 0;
        animation: nami-logo-fade 600ms ease forwards;
      }
      .nami-splash-divider {
        width: 1px; height: 30px; background: rgba(128,128,128,.25); flex-shrink: 0;
        max-width: 0; margin-left: 0; opacity: 0; overflow: hidden;
        animation: nami-divider-expand 400ms ease 1150ms forwards;
      }
      .nami-splash-wordmark {
        font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        font-size: 25px; font-weight: 400; letter-spacing: .3px; color: #2b2b30;
        white-space: nowrap; flex-shrink: 0; max-width: 0; margin-left: 0; opacity: 0; overflow: hidden;
        animation: nami-text-expand 600ms ease 1300ms forwards;
      }
      @media (prefers-color-scheme: dark) {
        .nami-splash-wordmark { color: #e8e8ec; }
        .nami-splash-divider { background: rgba(200,200,210,.2); }
      }
      @keyframes nami-logo-fade { 0% { opacity: 0; transform: scale(1.6); } 100% { opacity: 1; transform: scale(1); } }
      @keyframes nami-divider-expand { 0% { max-width: 0; margin-left: 0; opacity: 0; } 100% { max-width: 1px; margin-left: 14px; opacity: 1; } }
      @keyframes nami-text-expand { 0% { max-width: 0; margin-left: 0; opacity: 0; } 100% { max-width: 200px; margin-left: 14px; opacity: 1; } }
      .nami-splash-loader {
        position: absolute; top: calc(50% + 52px); left: 50%; transform: translateX(-50%);
        width: 180px; height: 3px; background: rgba(128,128,128,.18); border-radius: 2px;
        overflow: hidden; opacity: 0; transition: opacity .3s ease;
      }
      .nami-splash-loader.visible { opacity: 1; }
      .nami-splash-loader::after {
        content: ""; position: absolute; left: -40%; width: 40%; height: 100%;
        background: #6b8afd; border-radius: 2px;
        animation: nami-loader-slide 1.2s ease-in-out infinite;
      }
      @keyframes nami-loader-slide { 0% { left: -40%; } 100% { left: 100%; } }
      @media (prefers-color-scheme: dark) {
        .nami-splash-loader { background: rgba(200,200,210,.12); }
        .nami-splash-loader::after { background: #7a9aff; }
      }
    </style>
  </head>
  <body>
    <div id="nami-splash">
      <div class="nami-splash-content">
        <img class="nami-splash-logo" src="/splash-logo.png" alt="" />
        <span class="nami-splash-divider"></span>
        <span class="nami-splash-wordmark">Nami Mail</span>
      </div>
      <div class="nami-splash-loader"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
